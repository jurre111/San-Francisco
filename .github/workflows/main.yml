name: Build & Release IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    env:
      scheme: San Francisco
    outputs:
      scheme: ${{ env.scheme }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install acextract
        run: |
          brew tap canhth/homebrew-acextract
          brew trust canhth/acextract
          brew install acextract

      - name: get SF Symbols
        run: |
          export GLYPHS_PATH="/System/Library/PrivateFrameworks/SFSymbols.framework/Resources/CoreGlyphs.bundle/Contents/Resources"
          echo "Making plists..."
          python3 main.py
          echo "parsing Assets.car..."
          mkdir -p "symbols"
          acextract -i "${GLYPHS_PATH}/Assets.car" -o "symbols"
          ls "symbols"
          exit 1
      
      - name: install ldid
        run: brew install ldid
      - name: install xcpretty
        run: gem install xcpretty
      - name: setup xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: build app
        run: |
          chmod +x ipabuild.sh
          ./ipabuild.sh "$scheme" "1.0" $(git rev-list --count HEAD) ${GITHUB_SHA::7}

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.scheme }}-ipa
          path: ${{ env.scheme }}.ipa

  release:
    name: Release Nightly IPA 
    needs: build
    runs-on: ubuntu-latest
    env:
      scheme: ${{ needs.build.outputs.scheme }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: download ipa
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.scheme }}-ipa

      - name: update nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly >/dev/null 2>&1 || \
          gh release create nightly \
            --title "Nightly" \
            --prerelease
          gh release upload nightly "${{ env.scheme }}.ipa" --clobber
